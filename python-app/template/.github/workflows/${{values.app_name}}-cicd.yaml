name: ${{values.app_name}}-cicd

# Run this workflow when files under app/ change in a push to main.
on:
  push:
    paths:
      - app/**
    branches:
      - master

# Allow the CD job to push the updated Helm values file back to the repository.
permissions:
  contents: write

jobs:
  # CI job: build the application image and publish it to Docker Hub.
  ci:
    runs-on: ubuntu-latest
    steps:

      # Create a six-character commit ID for use as the Docker image tag.
      - name: Shorten commit id
        shell: bash
        run: |
          echo "COMMIT_ID=${GITHUB_SHA::6}" >> "$GITHUB_ENV"
      # Authenticate Docker so the following step can push the image.
      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ '${{ secrets.DOCKERHUB_USERNAME }}' }}
          password: ${{ '${{ secrets.DOCKERHUB_TOKEN }}' }}
      # Build the Docker image from the repository and push it tagged with the short commit ID.
      -
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: shuklamanasazure/${{values.app_name}}:${{ '${{ env.COMMIT_ID }}' }}
    # Make the image's commit tag available to the dependent CD job.
    outputs:
      commit_id: ${{ '${{ env.COMMIT_ID }}' }}

  # CD job: update the Helm image tag in Git, then ask Argo CD to sync the application.
  cd:
    # Wait for CI to finish so its image tag is available before deploying.
    needs: ci
    # Run deployment commands on the configured self-hosted runner.
    runs-on: self-hosted
    steps:

      # actions/checkout@v3 clones the repository onto the runner for the file update and commit.
      - uses: actions/checkout@v3

      # Install Python 3.12, used to install and run the yq YAML editing tool below.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Print the selected Python and pip locations and versions for verification.
      - name: Verify Python and pip
        run: |
          which python
          python --version
          python -m pip --version

      # Install yq and update the Helm chart's image tag to the image built by CI.
      #- name: Modify values file
      #  shell: bash
      #  run: |
      #    echo ${{needs.ci.outputs.commit_id}}
      #    python3 -m pip install yq
      #    yq -Yi '.image.tag = "${{'${{needs.ci.outputs.commit_id}}' }}"' charts/${{values.app_name}}/values-${{values.app_env}}.yaml

      # 3. Create a unique feature branch.
      - name: Create deployment branch
        shell: bash
        run: |
          git fetch origin master
          BRANCH="automation/deploy-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH" origin/master
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      # 4. Update the Helm image tag.
      - name: Modify Helm values file
        shell: bash
        env:
          IMAGE_TAG: ${{ '${{ needs.ci.outputs.commit_id }}' }}
          APP_NAME: ${{ values.app_name }}
          APP_ENV: ${{ values.app_env }}
        run: |
          python3 -m pip install yq

          VALUES_FILE="charts/${APP_NAME}/values-${APP_ENV}.yaml"

          echo "Updating image tag to: ${IMAGE_TAG}"
          echo "Updating file: ${VALUES_FILE}"

          IMAGE_TAG="$IMAGE_TAG" yq -y -i \
            '.image.tag = env.IMAGE_TAG' "$VALUES_FILE"

          cat "$VALUES_FILE"

      # 5. Commit and push the feature branch.
      - name: Commit and push changes
        shell: bash
        run: |
          git config user.name "shuklamanasazure"
          git config user.email "shuklamanasazure@gmail.com"  

          git add "charts/${{ values.app_name }}/values-${{ values.app_env }}.yaml"

          if git diff --cached --quiet; then
            echo "No Helm changes detected."
            exit 1
          fi

          git commit -m "Update Helm image tag to ${{ '${{ needs.ci.outputs.commit_id }}' }}"
          git push origin "$BRANCH"
      
      # Install GitHub CLI on the self-hosted runner.
      - name: Install GitHub CLI
        shell: bash
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y gh
          fi

          gh --version

      # 6. Create a PR targeting master.
      - name: Create Pull Request
        id: create_pr
        shell: bash
        env:
          GH_TOKEN: ${{ '${{ secrets.GH_PAT }}' }}
        run: |
          PR_URL=$(gh pr create \
            --base master \
            --head "$BRANCH" \
            --title "Deploy image ${{ '${{ needs.ci.outputs.commit_id }}' }}" \
            --body "Automated Helm image tag update generated by CD pipeline.")

          echo "PR_URL=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "Created PR: $PR_URL"

      # 7. Automatically approve the PR using a DIFFERENT GitHub identity.
      - name: Automatically approve PR
        env:
          GH_TOKEN: ${{ '${{ secrets.GH_APPROVER_TOKEN }}' }}
        run: |
          gh pr review "${{ '${{ steps.create_pr.outputs.PR_URL }}' }}" --approve

      # 8. Enable automatic merge. GitHub waits for required checks and approval before merging into master.
      - name: Enable automatic PR merge
        env:
          GH_TOKEN: ${{ '${{ secrets.GH_PAT }}' }}
        run: |
          gh pr merge "${{ '${{ steps.create_pr.outputs.PR_URL }}' }}" \
            --auto \
            --squash \
            --delete-branch

      # 9. Wait until GitHub confirms that the PR has merged.  
      - name: Wait for PR merge
        env:
          GH_TOKEN: ${{ '${{ secrets.GH_PAT }}' }}
          PR_URL: ${{ '${{ steps.create_pr.outputs.PR_URL }}' }}
        shell: bash
        run: |
          for i in $(seq 1 60); do
            MERGED_AT=$(gh pr view "$PR_URL" --json mergedAt --jq '.mergedAt // empty')

            if [ -n "$MERGED_AT" ]; then
              echo "PR successfully merged at $MERGED_AT"
             exit 0
            fi

            echo "Waiting for PR checks and merge... ($i/60)"
            sleep 10
          done

          echo "PR was not merged within 10 minutes."
          exit 1


      # Commit the changed Helm values file so the repository records the new image tag.
      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          message: "Updates values.yaml with commit ${{ '${{needs.ci.outputs.commit_id}}' }}"

      # Download the Argo CD CLI, make it executable, and install it on the runner's PATH.
      - name: Install argocd
        shell: bash
        run: |
          curl -ksSL -o argocd https://argocd-server.argocd/download/argocd-linux-amd64
          chmod +x argocd
          sudo mv ./argocd /usr/local/bin/argocd

      # Log in to Argo CD using the configured secret, then sync the fastapi-service application.
      - name: Argocd login
        shell: bash
        run: |
          argocd login argocd.test.com \
            --insecure  \
            --grpc-web \
            --username admin \
            --password  ${{ '${{ secrets.ARGOCD_PASSWORD }}' }}

      - name: Ensure argocd repo and app
        shell: bash
        run: |

          # Connects the argocd repo
          repo="https://github.com/shuklamanasazure-backstage/${{values.app_name}}.git"
          argocd repo list | grep -q $repo || argocd repo add $repo

          # Creates the argocd app
          argocd app get ${{values.app_name}} || argocd app create ${{values.app_name}} \
            --repo $repo \
            --path charts/${{values.app_name}} \
            --dest-namespace ${{values.app_env}} \
            --dest-server https://kubernetes.default.svc \
            --values values-${{values.app_env}}.yaml \
            --revision master \
            --sync-policy manual \
            --sync-option CreateNamespace=true

      - name: Argocd app sync
        shell: bash
        run: |
          argocd app sync ${{values.app_name}}
          argocd app wait ${{values.app_name}} --timeout 180
          

# Few errors deal during the pipeline execution:
# 1. Permission denied error while writing to the values.yaml file. 
# 2. Application name was wrong suring the argocd app sync the /api/v1/info endpoint.
# 3. The commit id was not being passed to the argocd app sync command, so the application was not being updated with the new image tag.
# 4. pip was not installed on the self-hosted runner, so the yq command was failing to update the values.yaml file.


#Your current workflow
#1. Backstage creates repository. (template.yaml   )
#2. GitHub Actions checks out the repository.
#3. CI builds and publishes Docker image.
#4. CD updates Helm values.
#5. CD creates and approves PR.
#6. GitHub merges and Argo CD syncs.